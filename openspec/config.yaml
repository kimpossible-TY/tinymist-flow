schema: spec-driven

context: |
  Product: tinymist-flow, a native macOS app built with Swift/AppKit and Python packaging.
  Scope: project profiles, preview lifecycle, packaging, branding, app tests, and documentation.
  A compatible external tinymist executable supplies compilation and rendering; engine sources are not maintained here.
  Preserve existing preview CLI and environment contracts and Apache License 2.0 notices.
  Use Conventional Commits and isolated test profiles; generated Markdown comes from Typst sources.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Docs are written in typst, a new markup language, and stored in the `docs/tinymist` directory
    - Store all documentation (including that for users) in `docs/tinymist` directory, and development documentation in `docs/tinymist/dev` directory.
    - Never edit generated markdown docs directly, which contains header containing "This file is generated" note.
